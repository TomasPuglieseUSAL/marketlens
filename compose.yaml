# MarketLens: PostgreSQL + Spring Boot + React servido por Nginx.
# El perfil predeterminado es registration (sin usuario precreado).
# El script start-compose-demo.ps1 fuerza el perfil demo si se desean credenciales demo.
# Ejecutar desde la RAIZ del repositorio: docker compose up --build -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketlens
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crea .env con POSTGRES_PASSWORD}
    ports:
      # La base anterior queda disponible solo en el equipo anfitrion.
      - '127.0.0.1:5433:5432'
    volumes:
      # Mantener exactamente el mismo nombre logico de volumen que en etapa 1.
      - marketlens_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: container,${MARKETLENS_PROFILE:-registration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crea .env con POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Crea .env con JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Puerto del backend disponible para la extension local.
      - '127.0.0.1:8080:8080'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El proxy Nginx atendera /api desde el mismo origen de React.
        VITE_API_BASE_URL: ''
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:5173:80'

volumes:
  marketlens_db_data:
