# Perfil exclusivo de pruebas. No usa Docker, .env ni bases de datos reales.
spring.datasource.url=jdbc:h2:mem:marketlens_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Valores ficticios: solo se usan durante el test.
security.jwt.secret=marketlens-test-only-jwt-secret-not-for-production-64-bytes-value
mercadolibre.oauth.enabled=false
mercadolibre.oauth.client-id=
mercadolibre.oauth.client-secret=
mercadolibre.oauth.redirect-uri=http://localhost:8080/api/integrations/mercadolibre/callback
gemini.api-key=
