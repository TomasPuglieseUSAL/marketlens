# Perfil de demostración de MarketLens.
# Docker Compose activa SPRING_PROFILES_ACTIVE=container,demo:
#   - container: conexión a PostgreSQL db:5432, Flyway y JPA ddl-auto=validate.
#   - demo: cuenta de acceso y publicaciones sintéticas; integraciones opcionales deshabilitadas.
# Este archivo NO configura la base de datos ni altera el esquema.

# Las operaciones OAuth se mantienen deshabilitadas para la demostración local.
mercadolibre.oauth.enabled=false
mercadolibre.oauth.client-id=
mercadolibre.oauth.client-secret=
mercadolibre.oauth.redirect-uri=http://localhost:8080/api/integrations/mercadolibre/callback

# La integración externa de Gemini no se utiliza en modo demo.
gemini.api-key=

# La contraseña se inyecta desde DEMO_PASSWORD; nunca se incorpora a Git.
# Un usuario existente conserva su contraseña al reiniciar.
marketlens.demo.username=demo
marketlens.demo.email=demo@marketlens.local
marketlens.demo.password=${DEMO_PASSWORD:}

# Inicialización idempotente de vendedores y publicaciones ficticias [DEMO].
# Las evaluaciones se calculan cuando se solicitan, no se preinsertan.
marketlens.demo.seed-samples=true

# En la prueba de instalación limpia se verificó la aplicación de Flyway V1-V19.
# La validación Hibernate para el perfil container está en application-container.properties.
