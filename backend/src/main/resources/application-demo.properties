# Se activa junto al perfil docker, no en ejecución normal.
# El perfil docker mantiene la conexión al PostgreSQL de Docker.
mercadolibre.oauth.enabled=false
mercadolibre.oauth.client-id=
mercadolibre.oauth.client-secret=
mercadolibre.oauth.redirect-uri=http://localhost:8080/api/integrations/mercadolibre/callback

gemini.api-key=

# Nunca guardar la contraseña del usuario demo en Git.
marketlens.demo.username=demo
marketlens.demo.email=demo@marketlens.local
marketlens.demo.password=${DEMO_PASSWORD:}
marketlens.demo.seed-samples=true

# Se mantiene el ddl-auto heredado de docker temporalmente.
