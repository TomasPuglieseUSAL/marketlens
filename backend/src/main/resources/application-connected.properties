# Perfil opt-in para comprobar OAuth centralizado de Mercado Libre.
# Activar con SPRING_PROFILES_ACTIVE=container,connected.
# Los perfiles demo y registration NO se modifican.
mercadolibre.oauth.enabled=true
mercadolibre.reviews.central-enabled=${MELI_REVIEWS_CENTRAL_ENABLED:false}
mercadolibre.reviews.central-owner=${MELI_REVIEWS_CENTRAL_OWNER:}

# Sin cuentas ni publicaciones de muestra en este perfil.
marketlens.demo.seed-samples=false
