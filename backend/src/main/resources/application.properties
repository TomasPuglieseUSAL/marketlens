spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/marketlens_db
spring.datasource.username=marketlens
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=3600
# Sesión persistente de extensión: inactividad y duración máxima.
security.session.inactivity-days=90
security.session.maximum-days=365

# Gemini API
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.embedding-model=gemini-embedding-2
gemini.text-model=gemini-3.1-flash-lite
gemini.embedding-dimensions=768