spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/marketlens_db
spring.datasource.username=marketlens
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=3600

# Mercado Libre OAuth
mercadolibre.oauth.client-id=${MELI_CLIENT_ID}
mercadolibre.oauth.client-secret=${MELI_CLIENT_SECRET}
mercadolibre.oauth.redirect-uri=${MELI_REDIRECT_URI:http://localhost:8080/api/integrations/mercadolibre/callback}

# Debe coincidir con la configuración del DevCenter
mercadolibre.oauth.pkce-enabled=${MELI_PKCE_ENABLED:true}

# Gemini API
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.embedding-model=gemini-embedding-2
gemini.text-model=gemini-3.1-flash-lite
gemini.embedding-dimensions=768