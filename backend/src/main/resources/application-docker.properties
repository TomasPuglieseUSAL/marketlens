# MarketLens | Perfil de desarrollo: backend ejecutado en Windows + PostgreSQL en Docker.
# Activarlo desde la carpeta backend: .\mvnw.cmd "-Dspring-boot.run.profiles=docker" spring-boot:run
#
# Importa el archivo .env de la raiz del repositorio como archivo Java Properties.
# Funciona porque el comando se ejecuta con directorio actual backend/.
# El .env no debe publicarse ni copiarse dentro del JAR.
spring.config.import=file:../.env[.properties]

# Puerto publicado por compose.yaml en la computadora anfitriona.
# Cuando el backend tambien se ejecute dentro de Docker, la URL cambiara a db:5432.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/marketlens
spring.datasource.username=marketlens
spring.datasource.password=${POSTGRES_PASSWORD}

# Solucion transitoria para una base de desarrollo NUEVA y aislada.
# Cuando agreguemos migraciones versionadas (Flyway), reemplazaremos esta opcion.
spring.jpa.hibernate.ddl-auto=update

# Credenciales opcionales durante la ejecución de desarrollo con Docker
mercadolibre.oauth.client-id=${MELI_CLIENT_ID:}
mercadolibre.oauth.client-secret=${MELI_CLIENT_SECRET:}