# Backend ejecutado DENTRO de Docker.
# Se usa con SPRING_PROFILES_ACTIVE=container,registration o container,demo.
# No usa localhost:5433, ni importa ../.env: Compose inyecta las variables.
spring.datasource.url=jdbc:postgresql://db:5432/marketlens
spring.datasource.username=marketlens
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway V1-V19 crea y actualiza el esquema antes de la validacion JPA.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

server.address=0.0.0.0
